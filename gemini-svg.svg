<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Degradados base y de sombras -->
    <radialGradient id="riceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </radialGradient>
    
    <radialGradient id="panGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#424242" />
      <stop offset="70%" stop-color="#212121" />
      <stop offset="100%" stop-color="#111111" />
    </radialGradient>

    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#212121" />
      <stop offset="92%" stop-color="#616161" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sombra base de la paella -->
  <ellipse cx="250" cy="260" rx="175" ry="175" fill="#000000" opacity="0.12" />

  <g filter="url(#shadow)">
    <!-- ASAS DE LA PAELLA -->
    <!-- Asas exteriores (Rojas / Tradicionales) -->
    <path d="M 65 250 C 30 250, 30 200, 75 200 C 80 200, 85 205, 85 212 C 85 218, 78 220, 70 220 C 52 220, 52 230, 70 230 C 78 230, 85 235, 85 242 C 85 248, 78 250, 65 250 Z" fill="#E53935" />
    <path d="M 435 250 C 470 250, 470 200, 425 200 C 420 200, 415 205, 415 212 C 415 218, 422 220, 430 220 C 448 220, 448 230, 430 230 C 422 230, 415 235, 415 242 C 415 248, 422 250, 435 250 Z" fill="#E53935" />

    <!-- CUERPO DE LA PAELLA (Borde exterior de acero/hierro) -->
    <circle cx="250" cy="250" r="175" fill="url(#panGrad)" />
    <circle cx="250" cy="250" r="175" fill="url(#rimGrad)" opacity="0.8" />
    <circle cx="250" cy="250" r="162" fill="#1A1A1A" />
    
    <!-- Remaches de las asas -->
    <circle cx="92" cy="215" r="3.5" fill="#BDBDBD" />
    <circle cx="92" cy="235" r="3.5" fill="#BDBDBD" />
    <circle cx="408" cy="215" r="3.5" fill="#BDBDBD" />
    <circle cx="408" cy="235" r="3.5" fill="#BDBDBD" />

    <!-- FONDO DE ARROZ (El socarrat / Arroz azafranado) -->
    <circle cx="250" cy="250" r="155" fill="url(#riceGrad)" />

    <!-- DETALLES DE TEXTURA DEL ARROZ (Granos distribuidos) -->
    <g fill="#FFA000" opacity="0.6">
      <rect x="200" y="150" width="10" height="4" rx="2" transform="rotate(15 200 150)" />
      <rect x="280" y="160" width="10" height="4" rx="2" transform="rotate(-30 280 160)" />
      <rect x="320" y="210" width="10" height="4" rx="2" transform="rotate(45 320 210)" />
      <rect x="160" y="270" width="10" height="4" rx="2" transform="rotate(80 160 270)" />
      <rect x="220" y="340" width="10" height="4" rx="2" transform="rotate(-15 220 340)" />
      <rect x="310" y="310" width="10" height="4" rx="2" transform="rotate(60 310 310)" />
      <rect x="150" y="200" width="10" height="4" rx="2" transform="rotate(-45 150 200)" />
      <rect x="340" y="260" width="10" height="4" rx="2" transform="rotate(10 340 260)" />
    </g>

    <!-- INGREDIENTES -->

    <!-- 1. BAZOCA / VERDURA (Judía verde) -->
    <g filter="url(#softShadow)">
      <!-- Judías verdes estilizadas -->
      <path d="M 165 180 Q 200 160 220 195 Q 200 205 165 180 Z" fill="#4CAF50" />
      <path d="M 280 300 Q 330 290 320 330 Q 285 340 280 300 Z" fill="#388E3C" />
      <path d="M 145 250 Q 180 230 175 275 Q 150 270 145 250 Z" fill="#4CAF50" />
    </g>

    <!-- 2. GARROFÓ (Alubia blanca grande valenciana) -->
    <g filter="url(#softShadow)" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5">
      <path d="M 220 300 C 200 290, 190 315, 210 325 C 225 330, 235 310, 220 300 Z" />
      <path d="M 290 190 C 275 175, 255 195, 275 210 C 290 215, 300 200, 290 190 Z" />
    </g>

    <!-- 3. GAMBAS / MARISCO (Diseño curvo emblemático) -->
    <g filter="url(#softShadow)">
      <!-- Gamba 1 (Izquierda Superior) -->
      <g transform="translate(180, 200) rotate(-20)">
        <path d="M 0 0 C -25 -20, -50 0, -40 25 C -35 35, -20 30, -25 15 C -28 5, -15 -5, 0 0 Z" fill="#FF5722" />
        <!-- Cola -->
        <path d="M -40 25 L -52 30 L -47 20 Z" fill="#E64A19" />
        <!-- Detalles de anillos -->
        <path d="M -18 -4 C -25 5, -22 15, -22 15" stroke="#FF8A65" stroke-width="2" fill="none" />
        <path d="M -28 2 C -33 10, -30 20, -30 20" stroke="#FF8A65" stroke-width="2" fill="none" />
      </g>

      <!-- Gamba 2 (Derecha Inferior) -->
      <g transform="translate(310, 270) rotate(150)">
        <path d="M 0 0 C -25 -20, -50 0, -40 25 C -35 35, -20 30, -25 15 C -28 5, -15 -5, 0 0 Z" fill="#FF5722" />
        <path d="M -40 25 L -52 30 L -47 20 Z" fill="#E64A19" />
        <path d="M -18 -4 C -25 5, -22 15, -22 15" stroke="#FF8A65" stroke-width="2" fill="none" />
        <path d="M -28 2 C -33 10, -30 20, -30 20" stroke="#FF8A65" stroke-width="2" fill="none" />
      </g>
    </g>

    <!-- 4. MEJILLONES (Símbolo visual potente) -->
    <g filter="url(#softShadow)">
      <!-- Mejillón 1 (Derecha) -->
      <g transform="translate(320, 210) rotate(-15)">
        <!-- Concha exterior (Negra/Azulada) -->
        <path d="M 0 0 C 25 -15, 45 10, 30 35 C 10 50, -10 30, 0 0 Z" fill="#263238" />
        <path d="M 3 4 C 23 -8, 40 12, 27 32 C 12 43, -4 27, 3 4 Z" fill="#37474F" />
        <!-- Carne del mejillón (Naranja vivo) -->
        <path d="M 8 10 C 20 0, 32 15, 22 28 C 12 35, 2 20, 8 10 Z" fill="#FF7043" />
      </g>
    </g>

    <!-- 5. TIRA DE PIMIENTO ROJO (Centro/Decorativo) -->
    <g filter="url(#softShadow)">
      <path d="M 220 230 C 240 210, 270 220, 280 250 C 260 240, 240 260, 220 230 Z" fill="#D32F2F" />
      <!-- Brillo en el pimiento -->
      <path d="M 230 225 C 245 215, 260 222, 268 235" stroke="#EF5350" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <!-- 6. RODAJA DE LIMÓN (Elemento central y fresco) -->
    <g transform="translate(245, 245)" filter="url(#softShadow)">
      <!-- Cáscara exterior -->
      <circle cx="0" cy="0" r="26" fill="#FBC02D" />
      <!-- Piel blanca -->
      <circle cx="0" cy="0" r="23" fill="#FFF9C4" />
      <!-- Pulpa -->
      <circle cx="0" cy="0" r="20" fill="#FDD835" />
      <!-- Gajos del limón -->
      <g stroke="#FFF9C4" stroke-width="1.5" fill="none">
        <line x1="0" y1="-20" x2="0" y2="20" />
        <line x1="-20" y1="0" x2="20" y2="0" />
        <line x1="-14" y1="-14" x2="14" y2="14" />
        <line x1="-14" y1="14" x2="14" y2="-14" />
      </g>
      <!-- Centro del limón -->
      <circle cx="0" cy="0" r="3" fill="#FFF9C4" />
    </g>

    <!-- VAPOR / HUMO DE COMIDA RECIÉN HECHA (Toque dinámico) -->
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3" filter="blur(2px)">
      <path d="M 210 140 Q 200 120 215 100 T 210 70" />
      <path d="M 250 130 Q 260 105 245 85 T 255 55" />
      <path d="M 290 140 Q 280 115 295 95 T 285 65" />
    </g>
  </g>
</svg>